<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>城门 · 一块网格掏空</title>
<style>
  html, body { margin: 0; height: 100%; background: #141311; color: #f4efe6; font: 15px/1.45 "Microsoft YaHei", "Noto Sans SC", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #note { position: fixed; left: 12px; top: 12px; max-width: min(460px, calc(100% - 24px)); background: rgba(20,19,17,.84); border-radius: 14px; padding: 12px 14px; pointer-events: none; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0; color: #e4d8c8; }
  #stat { margin-top: 6px; }
  #hud { position: fixed; left: 12px; bottom: 12px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 14px; background: #f4efe6; color: #1b1a17; }
</style>
</head>
<body>
<div id="note">
  <h1>城门这一块 · 掏空</h1>
  <p>不动原来的城镇。城门平时是几块整网格，表面按积木比例留缝和凸点。点中后这块网格被挖穿，碎块是同样的积木，弹出后落到地上就停。</p>
  <div id="stat"></div>
</div>
<div id="hud"><button type="button" id="reset">复原</button></div>
<script src="./three.min.js"></script>
<script>
(function () {
  "use strict";
  if (!window.THREE) { document.body.textContent = "缺少 three.js。"; return; }
  var NAMES = ["垂直掏穿", "中心炸开", "横向掏穿", "向上崩"];
  var SEED = 20261112;
  var BW = 0.48, BH = 0.4, BD = 0.48, STUD_H = 0.11, STUD_R = 0.15;
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x141311);
  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 80);
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0x2a2c30, 0.9));
  var sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(7, 12, 6);
  scene.add(sun);

  function hash(a, b, c) {
    var h = (SEED ^ Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1442695041)) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 2246822519);
    h = Math.imul(h ^ (h >>> 13), 3266489917);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function makeRng(n) {
    var s = n >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function plasticTexture() {
    var c = document.createElement("canvas");
    c.width = 128; c.height = 128;
    var g = c.getContext("2d");
    g.fillStyle = "#c44732";
    g.fillRect(0, 0, 128, 128);
    g.strokeStyle = "rgba(40,12,8,.55)";
    g.lineWidth = 4;
    g.strokeRect(2, 2, 124, 124);
    g.fillStyle = "#e7b56a";
    g.beginPath();
    g.ellipse(64, 42, 28, 22, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "rgba(255,255,255,.2)";
    g.beginPath();
    g.ellipse(54, 34, 10, 7, 0, 0, Math.PI * 2);
    g.fill();
    var tex = new THREE.CanvasTexture(c);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  var pieceMat = new THREE.MeshStandardMaterial({ map: plasticTexture(), roughness: 0.42, metalness: 0, side: THREE.DoubleSide });
  var wallMat = new THREE.MeshStandardMaterial({ color: 0xc44732, roughness: 0.4, metalness: 0, side: THREE.DoubleSide });

  function emptyBuf() { return { p: [], n: [] }; }
  function tri(buf, a, b, c) {
    var ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
    var vx = c.x - a.x, vy = c.y - a.y, vz = c.z - a.z;
    var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    var len = Math.hypot(nx, ny, nz) || 1;
    nx /= len; ny /= len; nz /= len;
    [a, b, c].forEach(function (q) { buf.p.push(q.x, q.y, q.z); buf.n.push(nx, ny, nz); });
  }
  function quad(buf, a, b, c, d) { tri(buf, a, b, c); tri(buf, a, c, d); }
  function addStud(buf, x, y, z) {
    var seg = 8, i, a0, a1, x0, z0, x1, z1;
    for (i = 0; i < seg; i++) {
      a0 = (i / seg) * Math.PI * 2; a1 = ((i + 1) / seg) * Math.PI * 2;
      x0 = Math.cos(a0) * STUD_R; z0 = Math.sin(a0) * STUD_R;
      x1 = Math.cos(a1) * STUD_R; z1 = Math.sin(a1) * STUD_R;
      tri(buf, { x: x + x0, y: y, z: z + z0 }, { x: x + x0, y: y + STUD_H, z: z + z0 }, { x: x + x1, y: y + STUD_H, z: z + z1 });
      tri(buf, { x: x + x0, y: y, z: z + z0 }, { x: x + x1, y: y + STUD_H, z: z + z1 }, { x: x + x1, y: y, z: z + z1 });
      tri(buf, { x: x, y: y + STUD_H, z: z }, { x: x + x0, y: y + STUD_H, z: z + z0 }, { x: x + x1, y: y + STUD_H, z: z + z1 });
    }
  }
  function geoFrom(buf) {
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(buf.p, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(buf.n, 3));
    return g;
  }
  function makePart(ox, oy, oz, nx, ny, nz) {
    var solid = new Uint8Array(nx * ny * nz);
    solid.fill(1);
    return { ox: ox, oy: oy, oz: oz, nx: nx, ny: ny, nz: nz, solid: solid, mesh: null };
  }
  function at(part, i, j, k) { return i + part.nx * (j + part.ny * k); }
  function has(part, i, j, k) {
    if (i < 0 || j < 0 || k < 0 || i >= part.nx || j >= part.ny || k >= part.nz) return false;
    return part.solid[at(part, i, j, k)] === 1;
  }
  function rebuild(part) {
    var buf = emptyBuf();
    var i, j, k, x0, y0, z0, x1, y1, z1;
    for (k = 0; k < part.nz; k++) for (j = 0; j < part.ny; j++) for (i = 0; i < part.nx; i++) {
      if (!has(part, i, j, k)) continue;
      x0 = part.ox + i * BW; x1 = x0 + BW;
      y0 = part.oy + j * BH; y1 = y0 + BH;
      z0 = part.oz + k * BD; z1 = z0 + BD;
      if (!has(part, i + 1, j, k)) quad(buf, { x: x1, y: y0, z: z1 }, { x: x1, y: y1, z: z1 }, { x: x1, y: y1, z: z0 }, { x: x1, y: y0, z: z0 });
      if (!has(part, i - 1, j, k)) quad(buf, { x: x0, y: y0, z: z0 }, { x: x0, y: y1, z: z0 }, { x: x0, y: y1, z: z1 }, { x: x0, y: y0, z: z1 });
      if (!has(part, i, j + 1, k)) {
        quad(buf, { x: x0, y: y1, z: z1 }, { x: x1, y: y1, z: z1 }, { x: x1, y: y1, z: z0 }, { x: x0, y: y1, z: z0 });
        addStud(buf, (x0 + x1) / 2, y1, (z0 + z1) / 2);
      }
      if (!has(part, i, j - 1, k)) quad(buf, { x: x0, y: y0, z: z0 }, { x: x1, y: y0, z: z0 }, { x: x1, y: y0, z: z1 }, { x: x0, y: y0, z: z1 });
      if (!has(part, i, j, k + 1)) quad(buf, { x: x0, y: y0, z: z1 }, { x: x1, y: y0, z: z1 }, { x: x1, y: y1, z: z1 }, { x: x0, y: y1, z: z1 });
      if (!has(part, i, j, k - 1)) quad(buf, { x: x1, y: y0, z: z0 }, { x: x0, y: y0, z: z0 }, { x: x0, y: y1, z: z0 }, { x: x1, y: y1, z: z0 });
    }
    var g = geoFrom(buf);
    if (part.mesh) { part.mesh.geometry.dispose(); part.mesh.geometry = g; }
    else {
      part.mesh = new THREE.Mesh(g, wallMat);
      part.mesh.userData.part = part;
      scene.add(part.mesh);
    }
  }
  var parts = [];
  function addPart(ox, oy, oz, nx, ny, nz) {
    var part = makePart(ox, oy, oz, nx, ny, nz);
    rebuild(part);
    parts.push(part);
  }
  addPart(-4.05, 0, -1.2, 4, 16, 5);
  addPart(2.13, 0, -1.2, 4, 16, 5);
  addPart(-4.05, 6.4, -1.2, 17, 4, 5);
  addPart(-4.3, 8.0, -1.45, 18, 1, 6);
  var ground = new THREE.Mesh(new THREE.BoxGeometry(18, 0.2, 12), new THREE.MeshStandardMaterial({ color: 0x2c3328, roughness: 0.92 }));
  ground.position.y = -0.1;
  scene.add(ground);

  var chipGeo = (function () {
    var buf = emptyBuf();
    quad(buf, { x: 0.22, y: -0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: -0.22 }, { x: 0.22, y: -0.2, z: -0.22 });
    quad(buf, { x: -0.22, y: -0.2, z: -0.22 }, { x: -0.22, y: 0.2, z: -0.22 }, { x: -0.22, y: 0.2, z: 0.22 }, { x: -0.22, y: -0.2, z: 0.22 });
    quad(buf, { x: -0.22, y: 0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: -0.22 }, { x: -0.22, y: 0.2, z: -0.22 });
    quad(buf, { x: -0.22, y: -0.2, z: -0.22 }, { x: 0.22, y: -0.2, z: -0.22 }, { x: 0.22, y: -0.2, z: 0.22 }, { x: -0.22, y: -0.2, z: 0.22 });
    quad(buf, { x: -0.22, y: -0.2, z: 0.22 }, { x: 0.22, y: -0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: 0.22 }, { x: -0.22, y: 0.2, z: 0.22 });
    quad(buf, { x: 0.22, y: -0.2, z: -0.22 }, { x: -0.22, y: -0.2, z: -0.22 }, { x: -0.22, y: 0.2, z: -0.22 }, { x: 0.22, y: 0.2, z: -0.22 });
    addStud(buf, 0, 0.2, 0);
    return geoFrom(buf);
  })();

  var yaw = 0.78, pitch = 0.36, dist = 16, drag = null;
  function aim() {
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    camera.position.set(Math.sin(yaw) * dist * cp, 2.6 + sp * dist, Math.cos(yaw) * dist * cp);
    camera.lookAt(0, 3.5, 0);
  }
  var ray = new THREE.Raycaster();
  var debris = [];
  var simOn = false;
  var simLeft = 0;
  var lastStat = "点城门。同一格每次同一种掏法。";

  function patternCells(part, cell, kind) {
    var list = [], seen = {}, out = [], i, j, t, key;
    function pushThrough(ii, jj) {
      if (ii < 0 || jj < 0 || ii >= part.nx || jj >= part.ny) return;
      for (t = 0; t < part.nz; t++) if (has(part, ii, jj, t)) list.push([ii, jj, t]);
    }
    if (kind === 0) for (j = 0; j < 3; j++) pushThrough(cell.i, cell.j - j);
    else if (kind === 1) {
      for (j = -1; j <= 1; j++) for (i = -1; i <= 1; i++) {
        if (i === 0 && j === 0) pushThrough(cell.i, cell.j);
        else if (has(part, cell.i + i, cell.j + j, cell.k)) list.push([cell.i + i, cell.j + j, cell.k]);
      }
    } else if (kind === 2) for (i = 0; i < 4; i++) pushThrough(cell.i + i, cell.j);
    else for (j = 0; j < 2; j++) for (i = 0; i < 2; i++) pushThrough(cell.i + i, cell.j + j);
    for (t = 0; t < list.length && out.length < 24; t++) {
      key = list[t][0] + "," + list[t][1] + "," + list[t][2];
      if (seen[key]) continue;
      seen[key] = 1;
      out.push(list[t]);
    }
    return out;
  }

  function strike(e) {
    var rect = renderer.domElement.getBoundingClientRect();
    var ndc = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(parts.map(function (p) { return p.mesh; }), false);
    if (!hits.length || !hits[0].face) return;
    var hit = hits[0];
    var part = hit.object.userData.part;
    var inward = hit.point.clone().addScaledVector(hit.face.normal, -0.08);
    var cell = {
      i: Math.floor((inward.x - part.ox) / BW),
      j: Math.floor((inward.y - part.oy) / BH),
      k: Math.floor((inward.z - part.oz) / BD)
    };
    if (!has(part, cell.i, cell.j, cell.k)) return;
    var kind = hash(cell.i + Math.round(part.ox * 10), cell.j, cell.k) % NAMES.length;
    var rand = makeRng(hash(cell.i, cell.j, kind + 11));
    var n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
    var cells = patternCells(part, cell, kind);
    cells.forEach(function (c) {
      part.solid[at(part, c[0], c[1], c[2])] = 0;
      var mesh = new THREE.Mesh(chipGeo, pieceMat);
      var origin = new THREE.Vector3(part.ox + (c[0] + 0.5) * BW, part.oy + (c[1] + 0.5) * BH, part.oz + (c[2] + 0.5) * BD);
      mesh.position.copy(origin);
      scene.add(mesh);
      var vx = n.x * (1.1 + rand() * 0.8) + (rand() - 0.5) * 0.6;
      var vy = kind === 3 ? 3.4 + rand() : (kind === 0 ? 0.15 : 0.8 + rand() * 0.7);
      var vz = n.z * (1.1 + rand() * 0.8) + (rand() - 0.5) * 0.6;
      if (kind === 2) vx += 2.4;
      debris.push({
        mesh: mesh,
        origin: origin.clone(),
        launched: origin.clone().addScaledVector(n, 0.42),
        pop: 0.14,
        pop0: 0.14,
        vx: vx, vy: vy, vz: vz,
        asleep: false
      });
    });
    rebuild(part);
    simOn = true;
    simLeft = 2.6;
    lastStat = NAMES[kind] + " · 这次 " + cells.length + " 块 · 物理开";
  }

  renderer.domElement.addEventListener("pointerdown", function (e) {
    drag = { x: e.clientX, y: e.clientY, yaw: yaw, pitch: pitch };
    var up = function (ev) {
      window.removeEventListener("pointerup", up);
      var moved = !drag || Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 6;
      drag = null;
      if (!moved) strike(ev);
    };
    window.addEventListener("pointerup", up);
  });
  window.addEventListener("pointermove", function (e) {
    if (!drag) return;
    yaw = drag.yaw - (e.clientX - drag.x) * 0.008;
    pitch = Math.max(0.12, Math.min(1.15, drag.pitch + (e.clientY - drag.y) * 0.006));
    aim();
  });
  renderer.domElement.addEventListener("wheel", function (e) {
    dist = Math.max(8, Math.min(28, dist + Math.sign(e.deltaY)));
    aim();
    e.preventDefault();
  }, { passive: false });

  function stepPhysics(dt) {
    if (!simOn) return;
    simLeft -= dt;
    var awake = false;
    debris.forEach(function (p) {
      if (p.asleep) return;
      if (p.pop > 0) {
        p.pop -= dt;
        var u = 1 - Math.max(p.pop, 0) / p.pop0;
        p.mesh.position.lerpVectors(p.origin, p.launched, Math.min(1, u));
        awake = true;
        return;
      }
      p.vy -= 26 * dt;
      p.mesh.position.x += p.vx * dt;
      p.mesh.position.y += p.vy * dt;
      p.mesh.position.z += p.vz * dt;
      if (p.mesh.position.y <= BH * 0.5) {
        p.mesh.position.y = BH * 0.5;
        p.vy = 0;
        p.vx *= 0.45;
        p.vz *= 0.45;
        if (Math.hypot(p.vx, p.vz) < 0.35 || simLeft <= 0) {
          p.vx = 0; p.vz = 0; p.asleep = true;
        }
      }
      if (!p.asleep) awake = true;
    });
    if (!awake || simLeft <= 0) {
      debris.forEach(function (p) {
        if (p.mesh.position.y < BH * 0.5) p.mesh.position.y = BH * 0.5;
        p.vx = 0; p.vy = 0; p.vz = 0; p.asleep = true;
      });
      simOn = false;
      lastStat = lastStat.replace("物理开", "已落地，物理停");
    }
  }

  var snapshots = parts.map(function (p) { return p.solid.slice(); });
  document.getElementById("reset").onclick = function () {
    debris.forEach(function (p) { scene.remove(p.mesh); });
    debris = []; simOn = false;
    parts.forEach(function (p, i) { p.solid = snapshots[i].slice(); rebuild(p); });
    lastStat = "已复原。点城门再试。";
  };
  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  var clock = new THREE.Clock();
  function aim() {
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    camera.position.set(Math.sin(yaw) * dist * cp, 2.6 + sp * dist, Math.cos(yaw) * dist * cp);
    camera.lookAt(0, 3.5, 0);
  }
  aim();
  (function loop() {
    requestAnimationFrame(loop);
    stepPhysics(Math.min(0.05, clock.getDelta()));
    document.getElementById("stat").textContent = "网格会跟着洞改形 · 碎块 " + debris.length + " · " + (simOn ? "物理开" : "物理关") + " · " + lastStat;
    window.__dbg = { tris: renderer.info.render.triangles, calls: renderer.info.render.calls };
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
