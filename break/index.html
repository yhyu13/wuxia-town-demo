<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>城门 · 一块网格掏空</title>
<style>
  html, body { margin: 0; height: 100%; background: #141311; color: #f4efe6; font: 15px/1.45 "Microsoft YaHei", "Noto Sans SC", sans-serif; overflow: hidden; }
  canvas { display: block; position: relative; z-index: 0; width: 100%; height: 100%; touch-action: none; }
  #note, #hud, #perf { z-index: 2; }
  #note { position: fixed; left: 12px; top: 12px; max-width: min(420px, calc(100% - 24px)); background: rgba(20,19,17,.84); border-radius: 14px; padding: 12px 14px; pointer-events: none; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0; color: #e4d8c8; }
  #stat { margin-top: 6px; }
  #hud { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; }
  #perf { position: fixed; right: 12px; bottom: 12px; width: min(280px, calc(100% - 24px)); background: rgba(20,19,17,.9); border-radius: 14px; padding: 12px 14px; }
  #fps { font-size: 28px; font-weight: 700; line-height: 1.1; }
  #perf p, #band, #load { margin: 4px 0 0; color: #e4d8c8; }
  .modes { display: flex; gap: 8px; margin-top: 8px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 14px; background: transparent; color: #f4efe6; box-shadow: inset 0 0 0 1px #f4efe6; }
  button.on { background: #f4efe6; color: #1b1a17; box-shadow: none; }
</style>
</head>
<body>
<div id="note">
  <h1>城门这一块 · 掏空</h1>
  <p>不动原来的城镇。轻点挖一个圆坑，按住拖就顺着指尖挖开一条。绿色还在算，红色已经停。</p>
  <div id="stat"></div>
</div>
<div id="hud"><button type="button" id="reset">复原</button></div>
<div id="perf">
  <div id="fps">-- 帧</div>
  <div id="band">帧率取样中</div>
  <p id="load">物理 -- ms</p>
  <div class="modes">
    <button type="button" id="mode-opt" class="on">物理优化</button>
    <button type="button" id="mode-max">物理吃满</button>
  </div>
</div>
<script src="./three.min.js"></script>
<script>
(function () {
  "use strict";
  if (!window.THREE) { document.body.textContent = "缺少 three.js。"; return; }
  var SEED = 20261112;
  var BW = 0.48, BH = 0.4, BD = 0.48, STUD_H = 0.11, STUD_R = 0.15;
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x141311);
  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 80);
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0x2a2c30, 0.9));
  var sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(7, 12, 6);
  scene.add(sun);

  function hash(a, b, c) {
    var h = (SEED ^ Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1442695041)) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 2246822519);
    h = Math.imul(h ^ (h >>> 13), 3266489917);
    return (h ^ (h >>> 16)) >>> 0;
  }
  var matOn = new THREE.MeshStandardMaterial({ color: 0x3ecf6e, emissive: 0x145c32, emissiveIntensity: 0.45, roughness: 0.42, metalness: 0, side: THREE.DoubleSide });
  var matOff = new THREE.MeshStandardMaterial({ color: 0xe04545, emissive: 0x5a1414, emissiveIntensity: 0.35, roughness: 0.42, metalness: 0, side: THREE.DoubleSide });
  var wallMat = new THREE.MeshStandardMaterial({ color: 0xc44732, roughness: 0.4, metalness: 0, side: THREE.DoubleSide });

  function emptyBuf() { return { p: [], n: [] }; }
  function tri(buf, a, b, c) {
    var ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
    var vx = c.x - a.x, vy = c.y - a.y, vz = c.z - a.z;
    var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    var len = Math.hypot(nx, ny, nz) || 1;
    nx /= len; ny /= len; nz /= len;
    [a, b, c].forEach(function (q) { buf.p.push(q.x, q.y, q.z); buf.n.push(nx, ny, nz); });
  }
  function quad(buf, a, b, c, d) { tri(buf, a, b, c); tri(buf, a, c, d); }
  function addStud(buf, x, y, z) {
    var seg = 8, i, a0, a1, x0, z0, x1, z1;
    for (i = 0; i < seg; i++) {
      a0 = (i / seg) * Math.PI * 2; a1 = ((i + 1) / seg) * Math.PI * 2;
      x0 = Math.cos(a0) * STUD_R; z0 = Math.sin(a0) * STUD_R;
      x1 = Math.cos(a1) * STUD_R; z1 = Math.sin(a1) * STUD_R;
      tri(buf, { x: x + x0, y: y, z: z + z0 }, { x: x + x0, y: y + STUD_H, z: z + z0 }, { x: x + x1, y: y + STUD_H, z: z + z1 });
      tri(buf, { x: x + x0, y: y, z: z + z0 }, { x: x + x1, y: y + STUD_H, z: z + z1 }, { x: x + x1, y: y, z: z + z1 });
      tri(buf, { x: x, y: y + STUD_H, z: z }, { x: x + x0, y: y + STUD_H, z: z + z0 }, { x: x + x1, y: y + STUD_H, z: z + z1 });
    }
  }
  function geoFrom(buf) {
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(buf.p, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(buf.n, 3));
    return g;
  }
  function makePart(ox, oy, oz, nx, ny, nz) {
    var solid = new Uint8Array(nx * ny * nz);
    solid.fill(1);
    return { ox: ox, oy: oy, oz: oz, nx: nx, ny: ny, nz: nz, solid: solid, mesh: null };
  }
  function at(part, i, j, k) { return i + part.nx * (j + part.ny * k); }
  function has(part, i, j, k) {
    if (i < 0 || j < 0 || k < 0 || i >= part.nx || j >= part.ny || k >= part.nz) return false;
    return part.solid[at(part, i, j, k)] === 1;
  }
  function rebuild(part) {
    var buf = emptyBuf();
    var i, j, k, x0, y0, z0, x1, y1, z1;
    for (k = 0; k < part.nz; k++) for (j = 0; j < part.ny; j++) for (i = 0; i < part.nx; i++) {
      if (!has(part, i, j, k)) continue;
      x0 = part.ox + i * BW; x1 = x0 + BW;
      y0 = part.oy + j * BH; y1 = y0 + BH;
      z0 = part.oz + k * BD; z1 = z0 + BD;
      if (!has(part, i + 1, j, k)) quad(buf, { x: x1, y: y0, z: z1 }, { x: x1, y: y1, z: z1 }, { x: x1, y: y1, z: z0 }, { x: x1, y: y0, z: z0 });
      if (!has(part, i - 1, j, k)) quad(buf, { x: x0, y: y0, z: z0 }, { x: x0, y: y1, z: z0 }, { x: x0, y: y1, z: z1 }, { x: x0, y: y0, z: z1 });
      if (!has(part, i, j + 1, k)) {
        quad(buf, { x: x0, y: y1, z: z1 }, { x: x1, y: y1, z: z1 }, { x: x1, y: y1, z: z0 }, { x: x0, y: y1, z: z0 });
        addStud(buf, (x0 + x1) / 2, y1, (z0 + z1) / 2);
      }
      if (!has(part, i, j - 1, k)) quad(buf, { x: x0, y: y0, z: z0 }, { x: x1, y: y0, z: z0 }, { x: x1, y: y0, z: z1 }, { x: x0, y: y0, z: z1 });
      if (!has(part, i, j, k + 1)) quad(buf, { x: x0, y: y0, z: z1 }, { x: x1, y: y0, z: z1 }, { x: x1, y: y1, z: z1 }, { x: x0, y: y1, z: z1 });
      if (!has(part, i, j, k - 1)) quad(buf, { x: x1, y: y0, z: z0 }, { x: x0, y: y0, z: z0 }, { x: x0, y: y1, z: z0 }, { x: x1, y: y1, z: z0 });
    }
    var g = geoFrom(buf);
    if (part.mesh) { part.mesh.geometry.dispose(); part.mesh.geometry = g; }
    else {
      part.mesh = new THREE.Mesh(g, wallMat);
      part.mesh.userData.part = part;
      scene.add(part.mesh);
    }
  }
  var parts = [];
  function addPart(ox, oy, oz, nx, ny, nz) {
    var part = makePart(ox, oy, oz, nx, ny, nz);
    rebuild(part);
    parts.push(part);
  }
  addPart(-4.05, 0, -1.2, 4, 16, 5);
  addPart(2.13, 0, -1.2, 4, 16, 5);
  addPart(-4.05, 6.4, -1.2, 17, 4, 5);
  addPart(-4.3, 8.0, -1.45, 18, 1, 6);
  var ground = new THREE.Mesh(new THREE.BoxGeometry(18, 0.2, 12), new THREE.MeshStandardMaterial({ color: 0x2c3328, roughness: 0.92 }));
  ground.position.y = -0.1;
  scene.add(ground);

  var chipGeo = (function () {
    var buf = emptyBuf();
    quad(buf, { x: 0.22, y: -0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: -0.22 }, { x: 0.22, y: -0.2, z: -0.22 });
    quad(buf, { x: -0.22, y: -0.2, z: -0.22 }, { x: -0.22, y: 0.2, z: -0.22 }, { x: -0.22, y: 0.2, z: 0.22 }, { x: -0.22, y: -0.2, z: 0.22 });
    quad(buf, { x: -0.22, y: 0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: -0.22 }, { x: -0.22, y: 0.2, z: -0.22 });
    quad(buf, { x: -0.22, y: -0.2, z: -0.22 }, { x: 0.22, y: -0.2, z: -0.22 }, { x: 0.22, y: -0.2, z: 0.22 }, { x: -0.22, y: -0.2, z: 0.22 });
    quad(buf, { x: -0.22, y: -0.2, z: 0.22 }, { x: 0.22, y: -0.2, z: 0.22 }, { x: 0.22, y: 0.2, z: 0.22 }, { x: -0.22, y: 0.2, z: 0.22 });
    quad(buf, { x: 0.22, y: -0.2, z: -0.22 }, { x: -0.22, y: -0.2, z: -0.22 }, { x: -0.22, y: 0.2, z: -0.22 }, { x: 0.22, y: 0.2, z: -0.22 });
    addStud(buf, 0, 0.2, 0);
    return geoFrom(buf);
  })();

  var yaw = 0.78, pitch = 0.36, dist = 16, gesture = null;
  var TAP_R = 2.55, SWIPE_R = 2.2, CAP = 140;
  var physMode = "opt", physMs = 0, solverPasses = 0;
  function aim() {
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    camera.position.set(Math.sin(yaw) * dist * cp, 2.6 + sp * dist, Math.cos(yaw) * dist * cp);
    camera.lookAt(0, 3.5, 0);
  }
  var ray = new THREE.Raycaster();
  var debris = [];
  var simOn = false;
  var lastStat = "轻点是圆坑，按住拖顺着指尖挖。空白处拖动能转头。";

  function paint(p) {
    var want = p.asleep ? matOff : matOn;
    if (p.mesh.material !== want) p.mesh.material = want;
  }
  function solidCell(part, x, y, z, nx, ny, nz) {
    function cellAt(px, py, pz) {
      return {
        i: Math.floor((px - part.ox) / BW),
        j: Math.floor((py - part.oy) / BH),
        k: Math.floor((pz - part.oz) / BD)
      };
    }
    var base = cellAt(x, y, z);
    if (has(part, base.i, base.j, base.k)) return base;
    var steps = [0.1, 0.22, 0.4, 0.62], s, c;
    for (s = 0; s < steps.length; s++) {
      c = cellAt(x - nx * steps[s], y - ny * steps[s], z - nz * steps[s]);
      if (has(part, c.i, c.j, c.k)) return c;
    }
    var a, b, d;
    for (d = -1; d <= 1; d++) for (b = -1; b <= 1; b++) for (a = -1; a <= 1; a++) {
      if (has(part, base.i + a, base.j + b, base.k + d)) return { i: base.i + a, j: base.j + b, k: base.k + d };
    }
    return null;
  }
  function pick(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    var ndc = new THREE.Vector2(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(parts.map(function (p) { return p.mesh; }), false);
    if (!hits.length || !hits[0].face) return null;
    var hit = hits[0];
    var n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
    var part = hit.object.userData.part;
    var cell = solidCell(part, hit.point.x, hit.point.y, hit.point.z, n.x, n.y, n.z);
    if (!cell) return null;
    return { part: part, cell: cell, n: n };
  }
  function pickAround(x, y) {
    var hit = pick(x, y);
    if (hit) return hit;
    var ox = [0, -6, 6, -12, 12], oy = [0, -6, 6], i, j;
    for (j = 0; j < oy.length; j++) for (i = 0; i < ox.length; i++) {
      if (!ox[i] && !oy[j]) continue;
      hit = pick(x + ox[i], y + oy[j]);
      if (hit) return hit;
    }
    return null;
  }
  function ballCells(part, cell, radius) {
    var list = [], ri = Math.ceil(radius), r2 = radius * radius, di, dj, dk;
    for (dk = -ri; dk <= ri; dk++) for (dj = -ri; dj <= ri; dj++) for (di = -ri; di <= ri; di++) {
      if (di * di + dj * dj + dk * dk > r2) continue;
      if (has(part, cell.i + di, cell.j + dj, cell.k + dk)) list.push([cell.i + di, cell.j + dj, cell.k + dk]);
    }
    return list;
  }
  function spanOf(cells) {
    var i0 = 99, i1 = -99, j0 = 99, j1 = -99, k0 = 99, k1 = -99, t;
    for (t = 0; t < cells.length; t++) {
      i0 = Math.min(i0, cells[t][0]); i1 = Math.max(i1, cells[t][0]);
      j0 = Math.min(j0, cells[t][1]); j1 = Math.max(j1, cells[t][1]);
      k0 = Math.min(k0, cells[t][2]); k1 = Math.max(k1, cells[t][2]);
    }
    return { di: i1 - i0, dj: j1 - j0, dk: k1 - k0 };
  }
  function carve(hit, radius) {
    if (!hit) return 0;
    var cells = ballCells(hit.part, hit.cell, radius);
    if (!cells.length) return 0;
    var made = 0, n = hit.n;
    cells.forEach(function (c) {
      hit.part.solid[at(hit.part, c[0], c[1], c[2])] = 0;
      if (debris.length >= CAP) return;
      var mesh = new THREE.Mesh(chipGeo, matOn);
      var origin = new THREE.Vector3(hit.part.ox + (c[0] + 0.5) * BW, hit.part.oy + (c[1] + 0.5) * BH, hit.part.oz + (c[2] + 0.5) * BD);
      mesh.position.copy(origin);
      scene.add(mesh);
      var rnd = (hash(c[0], c[1], c[2]) % 1000) / 1000;
      var rnd2 = (hash(c[2], c[0], 7) % 1000) / 1000;
      debris.push({
        mesh: mesh,
        origin: origin.clone(),
        launched: origin.clone().addScaledVector(n, 0.42),
        pop: 0.14,
        pop0: 0.14,
        age: 0,
        vx: n.x * (1.05 + rnd * 0.7) + (rnd - 0.5) * 0.45,
        vy: 0.65 + rnd * 0.7,
        vz: n.z * (1.05 + rnd2 * 0.7) + (rnd2 - 0.5) * 0.45,
        asleep: false
      });
      made++;
    });
    rebuild(hit.part);
    window.__lastCarve = { n: cells.length, spawned: made, span: spanOf(cells), radius: radius };
    return cells.length;
  }

  renderer.domElement.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) {
      gesture = { mode: "orbit", x: e.clientX, y: e.clientY, yaw: yaw, pitch: pitch };
      return;
    }
    var hit = pickAround(e.clientX, e.clientY);
    if (hit) gesture = { mode: "carve", x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, hit: hit, moved: false, removed: 0 };
    else gesture = { mode: "orbit", x: e.clientX, y: e.clientY, yaw: yaw, pitch: pitch };
  });
  window.addEventListener("pointermove", function (e) {
    if (!gesture) return;
    if (gesture.mode === "orbit") {
      yaw = gesture.yaw - (e.clientX - gesture.x) * 0.008;
      pitch = Math.max(0.12, Math.min(1.15, gesture.pitch + (e.clientY - gesture.y) * 0.006));
      aim();
      return;
    }
    if (Math.hypot(e.clientX - gesture.x, e.clientY - gesture.y) > 10) gesture.moved = true;
    if (!gesture.moved) return;
    if (Math.hypot(e.clientX - gesture.lx, e.clientY - gesture.ly) < 8) return;
    gesture.lx = e.clientX;
    gesture.ly = e.clientY;
    var hit = pick(e.clientX, e.clientY);
    if (!hit) return;
    gesture.removed += carve(hit, SWIPE_R);
  });
  window.addEventListener("pointerup", function () {
    if (!gesture) return;
    var g = gesture;
    gesture = null;
    if (g.mode !== "carve") return;
    if (!g.moved) {
      var n = carve(g.hit, TAP_R);
      lastStat = n ? ("点按 · 圆坑 " + n + " 块") : "没点到砖，再点墙面";
    } else lastStat = g.removed ? ("滑动 · 沿手指 " + g.removed + " 块") : "滑动没挖到砖";
  });
  renderer.domElement.addEventListener("wheel", function (e) {
    dist = Math.max(8, Math.min(28, dist + Math.sign(e.deltaY)));
    aim();
    e.preventDefault();
  }, { passive: false });

  function pairPass(live) {
    var minDist = 0.46, a, b, dx, dy, dz, d2, d, pen, nx, nz, rel, j;
    for (a = 0; a < live.length; a++) {
      for (b = a + 1; b < live.length; b++) {
        dx = live[b].mesh.position.x - live[a].mesh.position.x;
        dy = live[b].mesh.position.y - live[a].mesh.position.y;
        dz = live[b].mesh.position.z - live[a].mesh.position.z;
        d2 = dx * dx + dy * dy + dz * dz;
        if (d2 >= minDist * minDist || d2 < 1e-8) continue;
        d = Math.sqrt(d2);
        pen = (minDist - d) * 0.5;
        nx = dx / d; nz = dz / d;
        live[a].mesh.position.x -= nx * pen;
        live[a].mesh.position.z -= nz * pen;
        live[b].mesh.position.x += nx * pen;
        live[b].mesh.position.z += nz * pen;
        if (live[a].mesh.position.y < BH * 0.5) live[a].mesh.position.y = BH * 0.5;
        if (live[b].mesh.position.y < BH * 0.5) live[b].mesh.position.y = BH * 0.5;
        rel = (live[b].vx - live[a].vx) * nx + (live[b].vz - live[a].vz) * nz;
        if (rel < 0) {
          j = rel * 0.5;
          live[a].vx += j * nx; live[a].vz += j * nz;
          live[b].vx -= j * nx; live[b].vz -= j * nz;
        }
      }
    }
  }
  function stepPhysics(dt) {
    var t0 = performance.now();
    var maxMode = physMode === "max";
    var sub = maxMode ? 4 : 1;
    var h = dt / Math.max(sub, 1);
    var i, s, p, u, speed, grounded;
    for (i = 0; i < debris.length; i++) {
      p = debris[i];
      if (p.asleep) { paint(p); continue; }
      p.age += dt;
      if (p.pop > 0) {
        p.pop -= dt;
        u = 1 - Math.max(p.pop, 0) / p.pop0;
        p.mesh.position.lerpVectors(p.origin, p.launched, Math.min(1, u));
        paint(p);
        continue;
      }
      for (s = 0; s < sub; s++) {
        p.vy -= 26 * h;
        p.mesh.position.x += p.vx * h;
        p.mesh.position.y += p.vy * h;
        p.mesh.position.z += p.vz * h;
        if (p.mesh.position.y <= BH * 0.5) {
          p.mesh.position.y = BH * 0.5;
          p.vy = 0;
          p.vx *= maxMode ? 0.62 : 0.45;
          p.vz *= maxMode ? 0.62 : 0.45;
        }
      }
      speed = Math.hypot(p.vx, p.vz);
      grounded = p.mesh.position.y <= BH * 0.5 + 0.001;
      if (grounded && (maxMode ? p.age > 4.8 : (speed < 0.35 || p.age > 1.2))) {
        p.vx = 0; p.vy = 0; p.vz = 0; p.asleep = true;
      }
      paint(p);
    }
    solverPasses = 0;
    if (maxMode) {
      var live = [];
      for (i = 0; i < debris.length; i++) if (!debris[i].asleep && debris[i].pop <= 0) live.push(debris[i]);
      if (live.length > 1) {
        while (performance.now() - t0 < 22 && solverPasses < 20000) {
          pairPass(live);
          solverPasses++;
        }
      }
    }
    simOn = false;
    for (i = 0; i < debris.length; i++) if (!debris[i].asleep) simOn = true;
    physMs = performance.now() - t0;
  }

  var snapshots = parts.map(function (p) { return p.solid.slice(); });
  document.getElementById("reset").onclick = function () {
    debris.forEach(function (p) { scene.remove(p.mesh); });
    debris = []; simOn = false;
    parts.forEach(function (p, i) { p.solid = snapshots[i].slice(); rebuild(p); });
    lastStat = "已复原。轻点挖圆坑，按住拖顺着指尖挖。";
    window.__lastCarve = null;
  };
  function setMode(m) {
    physMode = m;
    document.getElementById("mode-opt").classList.toggle("on", m === "opt");
    document.getElementById("mode-max").classList.toggle("on", m === "max");
  }
  document.getElementById("mode-opt").onclick = function () { setMode("opt"); };
  document.getElementById("mode-max").onclick = function () { setMode("max"); };
  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  aim();
  window.__project = function (x, y, z) {
    var v = new THREE.Vector3(x, y, z).project(camera);
    return { x: (v.x + 1) / 2 * window.innerWidth, y: (-v.y + 1) / 2 * window.innerHeight };
  };
  var prevT = performance.now(), fpsEma = 60, fpsShown = 0, fpsStamp = 0;
  function bandOf(fps) {
    if (fps < 22) return "低于 30";
    var opts = [60, 45, 30], best = 60, bd = 1e9, i, d;
    for (i = 0; i < opts.length; i++) {
      d = Math.abs(fps - opts[i]);
      if (d < bd) { bd = d; best = opts[i]; }
    }
    return "贴近 " + best;
  }
  function loop(now) {
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, (now - prevT) / 1000);
    prevT = now;
    if (dt > 0.001) fpsEma = fpsEma * 0.85 + (1 / dt) * 0.15;
    stepPhysics(dt || 0.016);
    var activeN = 0, sleepN = 0, i;
    for (i = 0; i < debris.length; i++) { if (debris[i].asleep) sleepN++; else activeN++; }
    if (now - fpsStamp > 250) {
      fpsShown = Math.round(fpsEma);
      fpsStamp = now;
      document.getElementById("fps").textContent = fpsShown + " 帧";
      document.getElementById("band").textContent = bandOf(fpsShown) + " · 绿 " + activeN + " 在算 · 红 " + sleepN + " 已停";
      document.getElementById("load").textContent = "物理 " + physMs.toFixed(1) + " ms · " + (physMode === "max" ? "吃满，上限" : "优化，下限");
    }
    document.getElementById("stat").textContent = lastStat + (debris.length >= CAP ? " · 碎块已满，洞还能挖" : "");
    window.__dbg = {
      fps: Math.round(fpsEma),
      physMs: Math.round(physMs * 10) / 10,
      mode: physMode,
      active: activeN,
      asleep: sleepN,
      debris: debris.length,
      passes: solverPasses,
      tris: renderer.info.render.triangles,
      calls: renderer.info.render.calls,
      carve: window.__lastCarve || null
    };
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
