<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>城门 · 3D 贴图破碎</title>
<style>
  html, body { margin: 0; height: 100%; background: #141311; color: #f4efe6; font: 15px/1.45 "Microsoft YaHei", "Noto Sans SC", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #note { position: fixed; left: 12px; top: 12px; max-width: min(440px, calc(100% - 24px)); background: rgba(20,19,17,.84); border-radius: 14px; padding: 12px 14px; pointer-events: none; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0; color: #e4d8c8; }
  #stat { margin-top: 6px; }
  #hud { position: fixed; left: 12px; bottom: 12px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 14px; background: #f4efe6; color: #1b1a17; }
</style>
</head>
<body>
<div id="note">
  <h1>城门这一块 · 3D</h1>
  <p>从城镇里抽出南城门，不改原来的场景。砖缝和颗粒是贴图。点墙面，从那一格播出一种固定破碎，最多 16 块碎片。</p>
  <div id="stat"></div>
</div>
<div id="hud"><button type="button" id="reset">复原</button></div>
<script src="./three.min.js"></script>
<script>
(function () {
  "use strict";
  if (!window.THREE) { document.body.textContent = "缺少 three.js。"; return; }
  var NAMES = ["垂直塌落", "放射炸开", "向右滑落", "上抛再落"];
  var SEED = 20261112;
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x141311);
  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 80);
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0x2a2c30, 0.85));
  var sun = new THREE.DirectionalLight(0xffffff, 1.25);
  sun.position.set(8, 14, 6);
  scene.add(sun);

  function hash(a, b, c) {
    var h = (SEED ^ (a * 374761393) ^ (b * 668265263) ^ (c * 1442695041)) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 2246822519);
    h = Math.imul(h ^ (h >>> 13), 3266489917);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function makeRng(n) {
    var s = n >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function brickTexture(top) {
    var c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    var g = c.getContext("2d");
    g.fillStyle = "#1a1816";
    g.fillRect(0, 0, 256, 256);
    var cols = 4, rows = 8, bw = 256 / cols, bh = 256 / rows, r, i, off, shade;
    for (r = 0; r < rows; r++) {
      off = (r % 2) * (bw / 2);
      for (i = -1; i < cols + 1; i++) {
        shade = ((r * 3 + i * 5) % 5) * 6;
        g.fillStyle = top ? "rgb(" + (196 - shade) + "," + (168 - shade) + ",118)" : "rgb(" + (176 - shade) + "," + (58 - shade / 3) + "," + (48) + ")";
        g.fillRect(i * bw + off + 2, r * bh + 2, bw - 4, bh - 4);
        g.fillStyle = "rgba(0,0,0,.35)";
        g.fillRect(i * bw + off + 2, r * bh + bh - 4, bw - 4, 2);
        if (top) {
          g.fillStyle = "#f0d7ad";
          g.beginPath();
          g.ellipse(i * bw + off + bw / 2, r * bh + bh / 2, bw * 0.22, bh * 0.28, 0, 0, Math.PI * 2);
          g.fill();
        }
      }
    }
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }
  var sideTex = brickTexture(false);
  var topTex = brickTexture(true);
  function mats(w, h, d) {
    var side = new THREE.MeshStandardMaterial({ map: sideTex, roughness: 0.48, metalness: 0 });
    var top = new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.42, metalness: 0 });
    var bottom = new THREE.MeshStandardMaterial({ color: 0x3a332c, roughness: 0.8 });
    side.map = sideTex.clone();
    side.map.wrapS = side.map.wrapT = THREE.RepeatWrapping;
    side.map.repeat.set(Math.max(w, d) / 1.1, h / 0.72);
    top.map = topTex.clone();
    top.map.wrapS = top.map.wrapT = THREE.RepeatWrapping;
    top.map.repeat.set(w / 0.55, d / 0.55);
    return [side, side, top, bottom, side, side];
  }
  function box(w, h, d, x, y, z) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats(w, h, d));
    m.position.set(x, y, z);
    m.userData.solid = true;
    return m;
  }

  /* 南城门：宽 8、深 4.4、高 7.2，门洞宽 4.6、通行高约 4.46。只这一块。 */
  var gate = new THREE.Group();
  var pierW = 1.7, depth = 4.4, height = 7.2, opening = 4.6, passage = 4.46;
  gate.add(box(pierW, height, depth, -opening / 2 - pierW / 2, height / 2, 0));
  gate.add(box(pierW, height, depth, opening / 2 + pierW / 2, height / 2, 0));
  gate.add(box(opening, height - passage, depth, 0, passage + (height - passage) / 2, 0));
  gate.add(box(8.6, 0.7, 5.2, 0, height + 0.28, 0));
  scene.add(gate);
  var ground = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 12), new THREE.MeshStandardMaterial({ color: 0x2c3328, roughness: 0.9 }));
  ground.position.y = -0.1;
  scene.add(ground);

  var yaw = 0.7, pitch = 0.42, dist = 16, drag = null;
  function aim() {
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    camera.position.set(Math.sin(yaw) * dist * cp, 2.2 + sp * dist, Math.cos(yaw) * dist * cp);
    camera.lookAt(0, 3.2, 0);
  }
  renderer.domElement.addEventListener("pointerdown", onDown);
  window.addEventListener("pointermove", function (e) {
    if (!drag) return;
    yaw = drag.yaw - (e.clientX - drag.x) * 0.008;
    pitch = Math.max(0.15, Math.min(1.15, drag.pitch + (e.clientY - drag.y) * 0.006));
    aim();
  });
  renderer.domElement.addEventListener("wheel", function (e) {
    dist = Math.max(8, Math.min(28, dist + Math.sign(e.deltaY)));
    aim(); e.preventDefault();
  }, { passive: false });

  var ray = new THREE.Raycaster();
  var debris = [];
  var scars = [];
  var anim = null;
  var chipGeo = new THREE.BoxGeometry(0.5, 0.32, 0.36);
  var chipMat = new THREE.MeshStandardMaterial({ map: sideTex, roughness: 0.48 });

  function onDown(e) {
    if (e.target !== renderer.domElement) return;
    drag = { x: e.clientX, y: e.clientY, yaw: yaw, pitch: pitch, moved: false };
    var up = function (ev) {
      window.removeEventListener("pointerup", up);
      var moved = Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 6;
      drag = null;
      if (!moved) strike(ev);
    };
    window.addEventListener("pointerup", up);
  }
  function strike(e) {
    if (anim) return;
    var rect = renderer.domElement.getBoundingClientRect();
    var ndc = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(gate.children, false);
    if (!hits.length) return;
    var hit = hits[0];
    var n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
    var cell = new THREE.Vector3(Math.round(hit.point.x * 2), Math.round(hit.point.y * 2), Math.round(hit.point.z * 2));
    var kind = hash(cell.x, cell.y, cell.z) % NAMES.length;
    var rand = makeRng(hash(cell.x, cell.y, kind + 7));
    var tangent = new THREE.Vector3(n.z, 0, -n.x);
    if (tangent.lengthSq() < 0.01) tangent.set(1, 0, 0);
    tangent.normalize();
    var bitangent = new THREE.Vector3().crossVectors(n, tangent).normalize();
    var spots = [];
    var i, j;
    if (kind === 0) for (i = 0; i < 4; i++) spots.push([0, -i * 0.55]);
    else if (kind === 1) for (j = -1; j <= 1; j++) for (i = -1; i <= 1; i++) spots.push([i * 0.55, j * 0.45]);
    else if (kind === 2) for (i = 0; i < 4; i++) spots.push([i * 0.55, 0]);
    else for (i = 0; i < 3; i++) spots.push([0, i * 0.5]);
    var pieces = [];
    for (i = 0; i < spots.length && pieces.length < 16; i++) {
      var start = hit.point.clone()
        .addScaledVector(tangent, spots[i][0])
        .addScaledVector(bitangent, spots[i][1])
        .addScaledVector(n, 0.2);
      var end = start.clone();
      var mid = start.clone();
      var jx = (rand() - 0.5) * 0.8;
      if (kind === 0) { end.addScaledVector(n, 0.4).add(new THREE.Vector3(jx, -start.y - 0.2, 0)); mid.add(new THREE.Vector3(jx * 0.2, -0.4, 0)); }
      else if (kind === 1) { end.addScaledVector(tangent, spots[i][0] * 2.2).addScaledVector(bitangent, spots[i][1] * 1.4).addScaledVector(n, 1.4); mid.copy(end).addScaledVector(n, 0.8).setY(start.y + 0.6); }
      else if (kind === 2) { end.addScaledVector(tangent, 2.4).add(new THREE.Vector3(0, -1.2, 0)); mid.addScaledVector(tangent, 1.1).addScaledVector(n, 0.4); }
      else { end.add(new THREE.Vector3(jx, -start.y + 0.2, 0)).addScaledVector(n, 0.3); mid.addScaledVector(n, 0.8).setY(start.y + 1.3); }
      var mesh = new THREE.Mesh(chipGeo, chipMat);
      mesh.position.copy(start);
      scene.add(mesh);
      pieces.push({ mesh: mesh, s: start, m: mid, e: end, rot: (rand() - 0.5) * 3, delay: pieces.length * 0.04 });
    }
    var scar = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.08), new THREE.MeshStandardMaterial({ color: 0x1a1816 }));
    scar.position.copy(hit.point).addScaledVector(n, 0.02);
    scar.lookAt(hit.point.clone().add(n));
    scene.add(scar);
    scars.push(scar);
    anim = { name: NAMES[kind], pieces: pieces, t0: performance.now(), dur: 900 };
    debris = debris.concat(pieces);
  }
  function bez(p, u) {
    var a = 1 - u;
    return new THREE.Vector3(
      a * a * p.s.x + 2 * a * u * p.m.x + u * u * p.e.x,
      a * a * p.s.y + 2 * a * u * p.m.y + u * u * p.e.y,
      a * a * p.s.z + 2 * a * u * p.m.z + u * u * p.e.z
    );
  }
  document.getElementById("reset").onclick = function () {
    debris.forEach(function (p) { scene.remove(p.mesh); });
    scars.forEach(function (s) { scene.remove(s); });
    debris = []; scars = []; anim = null;
  };
  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  aim();
  (function loop() {
    requestAnimationFrame(loop);
    if (anim) {
      var elapsed = (performance.now() - anim.t0) / anim.dur;
      anim.pieces.forEach(function (p) {
        var u = Math.max(0, Math.min(1, (elapsed - p.delay) / 0.75));
        p.mesh.position.copy(bez(p, u));
        p.mesh.rotation.z = p.rot * u;
        p.mesh.rotation.x = p.rot * u * 0.6;
      });
      if (elapsed > 1.2) anim = null;
    }
    var label = anim ? ("正在播：" + anim.name + " · 碎片 " + anim.pieces.length) : "点城门表面";
    document.getElementById("stat").textContent = "城门 4 块网格 · 贴图 2 张 · " + label;
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
